<div data-component-name="KernelViewer" style="display: flex; flex-direction: column; flex: 1 0 auto;"></div><script class="kaggle-component" nonce="wQkqamU6c066daSwpbsusg==">var Kaggle=window.Kaggle||{};Kaggle.State=Kaggle.State||[];Kaggle.State.push({"kernel":{"id":6484023,"title":"Sentiment Analysis on Financial News","forkParent":null,"currentRunId":23198603,"mostRecentRunId":23198603,"url":"/mmmarchetti/sentiment-analysis-on-financial-news","tags":[{"name":"finance","slug":"finance","url":"/tags/finance"},{"name":"tutorial","slug":"tutorial","url":"/tags/tutorial"},{"name":"eda","slug":"eda","url":"/tags/eda"},{"name":"nlp","slug":"nlp","url":"/tags/nlp"}],"commentCount":0,"upvoteCount":16,"viewCount":1007,"forkCount":18,"bestPublicScore":null,"author":{"id":3393450,"displayName":"Marcos Martins Marchetti","email":null,"editedEmail":null,"editedEmailCode":null,"userName":"mmmarchetti","thumbnailUrl":"https://storage.googleapis.com/kaggle-avatars/thumbnails/3393450-kg.jpg","profileUrl":"/mmmarchetti","registerDate":"0001-01-01T00:00:00Z","lastVisitDate":"0001-01-01T00:00:00Z","statusId":0,"performanceTier":2,"userRoles":null,"userLogins":null,"groupIds":null,"duplicateUsers":null,"hasPhoneVerifications":false,"failedNerdchas":0,"hasPendingNerdcha":false,"deleteRequests":null,"userAttributes":null,"isAdmin":false,"isKaggleBot":false,"isAnonymous":false,"canAct":false,"canBeSeen":false,"thumbnailName":null,"isPhoneVerified":false},"isPrivate":false,"updatedTime":"2019-11-08T19:01:54.5233333Z","selfLink":"/kernels/6484023","pinnedDockerImageVersionId":null,"dockerImagePinningType":"original","originalDockerImageId":29840,"isLanguageTemplate":false,"medal":"bronze","topicId":null,"readGroupId":null,"writeGroupId":null,"slug":"sentiment-analysis-on-financial-news","hasUsedAccelerator":null,"pinnedSessionId":null,"disableComments":false},"kernelBlob":{"id":583251397,"settings":{"dockerImageVersionId":null,"dataSources":[{"sourceType":"DatasetVersion","sourceId":775750,"databundleVersionId":null,"mountSlug":""}],"sourceType":"notebook","language":"python","accelerator":"none","isInternetEnabled":false},"source":"{\u0022cells\u0022:[{\u0022metadata\u0022:{},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022### If you liked it, I would be grateful for your upvote :)\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u00223\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 1. Searching for gold inside HTML files\\n\u003cp\u003eIt used to take days for financial news to spread via radio, newspapers, and word of mouth. Now, in the age of the internet, it takes seconds. Did you know news articles are \u003cem\u003eautomatically\u003c/em\u003e being generated from figures and earnings call streams? Hedge funds and independent traders are using data science to process this wealth of information in the quest for profit.\u003c/p\u003e\\n\u003cp\u003eIn this notebook, we will generate investing insight by applying \u003ca href=\\\u0022https://en.wikipedia.org/wiki/Sentiment_analysis\\\u0022\u003esentiment analysis\u003c/a\u003e on financial news headlines from \u003ca href=\\\u0022https://finviz.com\\\u0022\u003eFINVIZ.com\u003c/a\u003e. Using this \u003ca href=\\\u0022https://en.wikipedia.org/wiki/Natural_language_processing\\\u0022\u003enatural language processing\u003c/a\u003e technique, we can understand the emotion behind the headlines and predict whether the market \u003cem\u003efeels\u003c/em\u003e good or bad about a stock. It would then be possible to make educated guesses on how certain stocks will perform and trade accordingly. (And hopefully, make money!)\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\u0022https://assets.datacamp.com/production/project_611/img/fb_headlines.png\\\u0022 alt=\\\u0022Facebook headlines from FINVIZ.com\\\u0022\u003e\u003c/p\u003e\\n\u003cp\u003eWhy headlines? And why from FINVIZ?\u003c/p\u003e\\n\u003col\u003e\\n\u003cli\u003eHeadlines, which have similar length, are easier to parse and group than full articles, which vary in length.\u003c/li\u003e\\n\u003cli\u003eFINVIZ has a list of trusted websites, and headlines from these sites tend to be more consistent in their jargon than those from independent bloggers. Consistent textual patterns will improve the sentiment analysis.\u003c/li\u003e\\n\u003c/ol\u003e\\n\u003cp\u003eAs \u003ca href=\\\u0022https://en.wikipedia.org/wiki/Web_scraping\\\u0022\u003eweb scraping\u003c/a\u003e requires data science ethics (sending a lot of traffic to a FINVIZ\u0027s servers isn\u0027t very nice), the HTML files for Facebook and Tesla at various points in time have been downloaded. Let\u0027s import these files into memory.\u003c/p\u003e\\n\u003cp\u003e\u003cstrong\u003eDisclaimer: Investing in the stock market involves risk and can lead to monetary loss. The content in this notebook is not to be taken as financial advice.\u003c/strong\u003e \u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u00223\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Import libraries\\nimport warnings\\nwarnings.filterwarnings(\\\u0022ignore\\\u0022, category=FutureWarning)\\nfrom bs4 import BeautifulSoup\\nimport pandas as pd\\nimport os\\n\\nhtml_tables = {}\\n\\n# For every table in the datasets folder...\\nfor table_name in os.listdir(\u0027../input\u0027):\\n    #this is the path to the file. Don\u0027t touch!\\n    table_path = f\u0027../input/{table_name}\u0027\\n    \\n    # Open as a python file in read-only mode\\n    table_file = open(table_path, \u0027r\u0027)\\n    \\n    # Read the contents of the file into \u0027html\u0027\\n    html = BeautifulSoup(open(table_path, \u0027r\u0027))\\n    \\n    # Find \u0027news-table\u0027 in the Soup and load it into \u0027html_table\u0027\\n    html_table = html.find(id=\u0027news-table\u0027)\\n    \\n    # Add the table to our dictionary\\n    html_tables[table_name] = html_table   \\n\\nprint(\u0027ok!\u0027)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002210\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 2. What is inside those files anyway?\\n\u003cp\u003eWe\u0027ve grabbed the table that contains the headlines from each stock\u0027s HTML file, but before we start parsing those tables further, we need to understand how the data in that table is structured. We have a few options for this:\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eOpen the HTML file with a text editor (preferably one with syntax highlighting, like \u003ca href=\\\u0022http://www.sublimetext.com/\\\u0022\u003eSublime Text\u003c/a\u003e) and explore it there\u003c/li\u003e\\n\u003cli\u003eUse your browser\u0027s \u003ca href=\\\u0022https://addons.mozilla.org/en-US/firefox/addon/web-developer/\\\u0022\u003ewebdev toolkit\u003c/a\u003e to explore the HTML\u003c/li\u003e\\n\u003cli\u003eExplore the headlines table here in this notebook!\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003eLet\u0027s do the third option.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002210\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Read one single day of headlines \\ntsla = html_tables[\u0027tsla_22sep.html\u0027]\\n# Get all the table rows tagged in HTML with \u003ctr\u003e into \u0027tesla_tr\u0027\\ntsla_tr = tsla.findAll(\u0027tr\u0027)\\n\\n# For each row...\\n\\nfor i, table_row in enumerate(tsla_tr):\\n    # Read the text of the element \u0027a\u0027 into \u0027link_text\u0027\\n    link_text = table_row.a.get_text()\\n    # Read the text of the element \u0027td\u0027 into \u0027data_text\u0027\\n    data_text = table_row.td.get_text()\\n    # Print the count\\n    print(f\u0027{i}:\u0027)\\n    # Print the contents of \u0027link_text\u0027 and \u0027data_text\u0027 \\n    print(link_text)\\n    print(data_text)\\n    # The following exits the loop after three rows to prevent spamming the notebook, do not touch\\n    if i == 3:\\n        break\\n    \u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002217\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 3. Extra, extra! Extract the news headlines\\n\u003cp\u003eAs we saw above, the interesting data inside each table row (\u003ccode\u003e\u0026lt;tr\u0026gt;\u003c/code\u003e) is in the text inside the \u003ccode\u003e\u0026lt;td\u0026gt;\u003c/code\u003e and \u003ccode\u003e\u0026lt;a\u0026gt;\u003c/code\u003e tags. Let\u0027s now actually parse the data for \u003cstrong\u003eall\u003c/strong\u003e tables in a comfortable data structure.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002217\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Hold the parsed news into a list\\nparsed_news = []\\n# Iterate through the news\\nfor file_name, news_table in html_tables.items():\\n    # Iterate through all tr tags in \u0027news_table\u0027\\n    for x in news_table.findAll(\u0027tr\u0027):\\n        \\n        # Read the text from the tr tag into text\\n        text = x.get_text()\\n\\n        # Split the text in the td tag into a list \\n        date_scrape = x.td.text.split()\\n        headline = x.a.text\\n\\n        # If the length of \u0027date_scrape\u0027 is 1, load \u0027time\u0027 as the only element\\n        # If not, load \u0027date\u0027 as the 1st element and \u0027time\u0027 as the second\\n        \\n        if len(date_scrape) == 1:\\n            time = date_scrape[0]\\n            \\n        else:\\n            date = date_scrape[0]\\n            time = date_scrape[1]\\n        \\n        # Extract the ticker from the file name, get the string up to the 1st \u0027_\u0027  \\n        ticker = file_name.split(\u0027_\u0027)[0]\\n        \\n        # Append ticker, date, time and headline as a list to the \u0027parsed_news\u0027 list\\n        parsed_news.append([ticker, date, time, headline])\\n\\nprint(parsed_news[:10])\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002224\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 4. Make NLTK think like a financial journalist\\n\u003cp\u003eSentiment analysis is very sensitive to context. As an example, saying \u003cem\u003e\\\u0022This is so addictive!\\\u0022\u003c/em\u003e often means something positive if the context is a video game you are enjoying with your friends, but it very often means something negative when we are talking about opioids. Remember that the reason we chose headlines is so we can try to extract sentiment from financial journalists, who like most professionals, have their own lingo. Let\u0027s now make NLTK think like a financial journalist by adding some new words and sentiment values to our lexicon.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002224\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# NLTK VADER for sentiment analysis\\nfrom nltk.sentiment.vader import SentimentIntensityAnalyzer\\n\\n# New words and values\\nnew_words = {\\n    \u0027crushes\u0027: 10,\\n    \u0027beats\u0027: 5,\\n    \u0027misses\u0027: -5,\\n    \u0027trouble\u0027: -10,\\n    \u0027falls\u0027: -100,\\n}\\n# Instantiate the sentiment intensity analyzer with the existing lexicon\\nvader = SentimentIntensityAnalyzer()\\n# Update the lexicon\\nvader.lexicon.update(new_words)\\n\\nprint(\u0027ok!\u0027)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002231\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 5. BREAKING NEWS: NLTK Crushes Sentiment Estimates\\n\u003cp\u003eNow that we have the data and the algorithm loaded, we will get to the core of the matter: programmatically predicting sentiment out of news headlines! Luckily for us, VADER is very high level so, in this case, we will not adjust the model further\u003csup\u003e*\u003c/sup\u003e other than the lexicon additions from before.\u003c/p\u003e\\n\u003cp\u003e\u003csup\u003e*\u003c/sup\u003eVADER \\\u0022out-of-the-box\\\u0022 with some extra lexicon would likely translate into \u003cstrong\u003eheavy losses\u003c/strong\u003e with real money. A real sentiment analysis tool with chances of being profitable will require a very extensive and dedicated to finance news lexicon. Furthermore, it might also not be enough using a pre-packaged model like VADER.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002231\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Use these column names\\ncolumns = [\u0027ticker\u0027, \u0027date\u0027, \u0027time\u0027, \u0027headline\u0027]\\n# Convert the list of lists into a DataFrame\\nscored_news = pd.DataFrame(parsed_news, columns=columns)\\n\\n# Iterate through the headlines and get the polarity scores\\nscores = scored_news[\u0027headline\u0027].apply(vader.polarity_scores)\\n\\n# Convert the list of dicts into a DataFrame\\nscores_df = pd.DataFrame.from_records(scores)\\n\\n# Join the DataFrames\\nscored_news = scored_news.join(scores_df)\\n\\n# Convert the date column from string to datetime\\nscored_news[\u0027date\u0027] = pd.to_datetime(scored_news.date).dt.date\\nprint(scored_news.head())\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002238\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 6. Plot all the sentiment in subplots\\n\u003cp\u003eNow that we have the scores, let\u0027s start plotting the results. We will start by plotting the time series for the stocks we have.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002238\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022import matplotlib.pyplot as plt\\nimport seaborn as sns\\n\\n%matplotlib inline\\n\\n# Group by date and ticker columns from scored_news and calculate the mean\\nmean_c = scored_news.groupby([\u0027date\u0027, \u0027ticker\u0027]).mean()\\n\\n# Unstack the column ticker\\nmean_c = mean_c.unstack(\u0027ticker\u0027)\\n\\n# Get the cross-section of compound in the \u0027columns\u0027 axis\\nmean_c = mean_c.xs(\u0027compound\u0027, axis=\u0027columns\u0027)\\n# Plot a bar chart with pandas\\n\\nmean_c.plot(kind=\u0027bar\u0027, figsize=(10,5), width=1)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002245\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 7. Weekends and duplicates\\n\u003cp\u003eWhat happened to Tesla on November 22nd? Since we happen to have the headlines inside our \u003ccode\u003eDataFrame\u003c/code\u003e, a quick peek reveals that there are a few problems with that particular day: \u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eThere are only 5 headlines for that day.\u003c/li\u003e\\n\u003cli\u003eTwo headlines are verbatim the same as another but from another news outlet.\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003eLet\u0027s clean up the dataset a bit, but not too much! While some headlines are the same news piece from different sources, the fact that they are written differently could provide different perspectives on the same story. Plus, when one piece of news is more important, it tends to get more headlines from multiple sources. What we want to get rid of is verbatim copied headlines, as these are very likely coming from the same journalist and are just being \\\u0022forwarded\\\u0022 around, so to speak.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002245\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Count the number of headlines in scored_news (store as integer)\\nnum_news_before = scored_news[\u0027headline\u0027].count()\\n\\n# Drop duplicates based on ticker and headline\\nscored_news_clean = scored_news.drop_duplicates(subset=[\u0027ticker\u0027,\u0027headline\u0027])\\n                      \\n# Count number of headlines after dropping duplicates\\nnum_news_after = scored_news_clean[\u0027headline\u0027].count()\\n                                                        \\n# Print before and after numbers to get an idea of how we did \\nprint(f\\\u0022Before we had {num_news_before} headlines, now we have {num_news_after}\\\u0022)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002252\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 8. Sentiment on one single trading day and stock\\n\u003cp\u003eJust to understand the possibilities of this dataset and get a better feel of the data, let\u0027s focus on one trading day and one single stock. We will make an informative plot where we will see the smallest grain possible: headline and subscores.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002252\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Set the index to ticker and date\\nsingle_day = scored_news_clean.set_index([\u0027ticker\u0027, \u0027date\u0027])\\n# Cross-section the fb row\\nsingle_day = single_day.xs(\u0027fb\u0027)\\n\\n# Select the 3rd of January of 2019\\nsingle_day = single_day[\u00272019-01-3\u0027]\\n\\n# Convert the datetime string to just the time\\nsingle_day[\u0027time\u0027] = pd.to_datetime(single_day[\u0027time\u0027]).dt.time\\n\\n# Set the index to time and \\nsingle_day = single_day.set_index(\u0027time\u0027)\\n\\n# Sort it\\nsingle_day = single_day.sort_index()\\nprint(single_day.info())\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002259\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 9. Visualize the single day\\n\u003cp\u003eWe will make a plot to visualize the positive, negative and neutral scores for a single day of trading and a single stock. This is just one of the many ways to visualize this dataset.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002259\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022TITLE = \\\u0022Positive, negative and neutral sentiment for FB on 2019-01-03\\\u0022\\nCOLORS = [\\\u0022red\\\u0022, \\\u0022orange\\\u0022, \\\u0022green\\\u0022]\\n\\n# Drop the columns that aren\u0027t useful for the plot\\nplot_day = single_day.drop([\u0027headline\u0027, \u0027compound\u0027], axis=1)\\n\\n# Change the column names to \u0027negative\u0027, \u0027positive\u0027, and \u0027neutral\u0027\\nplot_day.columns = [\u0027negative\u0027, \u0027positive\u0027, \u0027neutral\u0027]\\n\\n# Plot a stacked bar chart\\nplot_day.plot(kind=\u0027bar\u0027, color=COLORS, figsize=(10,5), width=1)\\n\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]}],\u0022metadata\u0022:{\u0022kernelspec\u0022:{\u0022name\u0022:\u0022python3\u0022,\u0022display_name\u0022:\u0022Python 3\u0022,\u0022language\u0022:\u0022python\u0022},\u0022language_info\u0022:{\u0022name\u0022:\u0022python\u0022,\u0022version\u0022:\u00223.6.7\u0022,\u0022mimetype\u0022:\u0022text/x-python\u0022,\u0022codemirror_mode\u0022:{\u0022name\u0022:\u0022ipython\u0022,\u0022version\u0022:3},\u0022pygments_lexer\u0022:\u0022ipython3\u0022,\u0022nbconvert_exporter\u0022:\u0022python\u0022,\u0022file_extension\u0022:\u0022.py\u0022}},\u0022nbformat\u0022:4,\u0022nbformat_minor\u0022:1}","dateCreated":"2019-11-08T18:54:26.3385617Z"},"kernelRun":{"id":23198603,"kernelId":6484023,"status":"complete","type":"batch","sourceType":"notebook","language":"python","title":"Sentiment Analysis on Financial News","dateCreated":"2019-11-08T19:01:54.11Z","dateEvaluated":"2019-11-08T19:01:54.523Z","dateCancelled":null,"workerContainerPort":null,"workerUptimeSeconds":136148,"workerIPAddress":"172.20.4.9     ","workerIPAddressExternal":"35.239.224.168 ","scriptLanguageId":9,"scriptLanguageName":"IPython Notebook HTML","renderedOutputUrl":"https://www.kaggleusercontent.com/kf/23198603/eyJhbGciOiJkaXIiLCJlbmMiOiJBMTI4Q0JDLUhTMjU2In0..zRxpX2YcJ3pO3eSs2zRgeg.rF27xx8Nxf_7PxMjjI9XuYotfrAbWKuYFXr-W4GTgaD_VtbYCt3oCMWpyYn2xZ0edncH-ugmudAWVxKNKKEY13nikTUK-JY0ghjyKLg3iZKzjTVjddNTCgAcIz_cjWS62p0NTN7lxjwMKiDTdN9Vt2Z7CxCqxwMB94MVa6UVdGHN-L8rDei1OQJ8FlmVOZANf_DpqiIWj8O33e2vJy86F38K5v_FDk9L5jjS3u1LYQOBVRceIC6Ob7RtlF_1FrJomGCRo7RSl3zTtXP4RvT6a1ZBM4ZM-cTSiYc_KHt2ezIrtTXs6Vws-NWhunyAC8K_CSvueiwCG5jCKvjsEtSC06u0AoK-9QE0fSoJvKnddzHCVLvumk354DaXBuRkTBT9Qo5f9pZWT7xepJCzNU2FYahd4O41Cjm6baCnuXJtSKA_I-WqaXe0z0n1FYs4zOY3g0M2yc5gtRxP1u7j3s3OTvYacJF9wHDIJp5Auzj_GGx55ifQOjON2LvE86jcGTIIAeA8c2Lhbcq3tQ_VeQ1W2RGa9yhTt03c5T48U9q-g0GTH8D3udMB5XGBwe0e7T6P785flFiAPR3xwa4yDrzb5XsSgI0G7AVM7MZLQxy9T784nYB6UJwqnYFyZgqFfI9EratA2bONwIiGlrpWIXllOUGSQ_GuKcMazRIS8Q8TopFV8JmgKiEcoZl90qu1bHmD.OFikkG96tz0M5_PHBwYFKw/__resultx__.html","commit":{"id":583251397,"settings":{"dockerImageVersionId":null,"dataSources":[{"sourceType":"DatasetVersion","sourceId":775750,"databundleVersionId":null,"mountSlug":""}],"sourceType":"notebook","language":"python","accelerator":"none","isInternetEnabled":false},"source":"{\u0022cells\u0022:[{\u0022metadata\u0022:{},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022### If you liked it, I would be grateful for your upvote :)\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u00223\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 1. Searching for gold inside HTML files\\n\u003cp\u003eIt used to take days for financial news to spread via radio, newspapers, and word of mouth. Now, in the age of the internet, it takes seconds. Did you know news articles are \u003cem\u003eautomatically\u003c/em\u003e being generated from figures and earnings call streams? Hedge funds and independent traders are using data science to process this wealth of information in the quest for profit.\u003c/p\u003e\\n\u003cp\u003eIn this notebook, we will generate investing insight by applying \u003ca href=\\\u0022https://en.wikipedia.org/wiki/Sentiment_analysis\\\u0022\u003esentiment analysis\u003c/a\u003e on financial news headlines from \u003ca href=\\\u0022https://finviz.com\\\u0022\u003eFINVIZ.com\u003c/a\u003e. Using this \u003ca href=\\\u0022https://en.wikipedia.org/wiki/Natural_language_processing\\\u0022\u003enatural language processing\u003c/a\u003e technique, we can understand the emotion behind the headlines and predict whether the market \u003cem\u003efeels\u003c/em\u003e good or bad about a stock. It would then be possible to make educated guesses on how certain stocks will perform and trade accordingly. (And hopefully, make money!)\u003c/p\u003e\\n\u003cp\u003e\u003cimg src=\\\u0022https://assets.datacamp.com/production/project_611/img/fb_headlines.png\\\u0022 alt=\\\u0022Facebook headlines from FINVIZ.com\\\u0022\u003e\u003c/p\u003e\\n\u003cp\u003eWhy headlines? And why from FINVIZ?\u003c/p\u003e\\n\u003col\u003e\\n\u003cli\u003eHeadlines, which have similar length, are easier to parse and group than full articles, which vary in length.\u003c/li\u003e\\n\u003cli\u003eFINVIZ has a list of trusted websites, and headlines from these sites tend to be more consistent in their jargon than those from independent bloggers. Consistent textual patterns will improve the sentiment analysis.\u003c/li\u003e\\n\u003c/ol\u003e\\n\u003cp\u003eAs \u003ca href=\\\u0022https://en.wikipedia.org/wiki/Web_scraping\\\u0022\u003eweb scraping\u003c/a\u003e requires data science ethics (sending a lot of traffic to a FINVIZ\u0027s servers isn\u0027t very nice), the HTML files for Facebook and Tesla at various points in time have been downloaded. Let\u0027s import these files into memory.\u003c/p\u003e\\n\u003cp\u003e\u003cstrong\u003eDisclaimer: Investing in the stock market involves risk and can lead to monetary loss. The content in this notebook is not to be taken as financial advice.\u003c/strong\u003e \u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u00223\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Import libraries\\nimport warnings\\nwarnings.filterwarnings(\\\u0022ignore\\\u0022, category=FutureWarning)\\nfrom bs4 import BeautifulSoup\\nimport pandas as pd\\nimport os\\n\\nhtml_tables = {}\\n\\n# For every table in the datasets folder...\\nfor table_name in os.listdir(\u0027../input\u0027):\\n    #this is the path to the file. Don\u0027t touch!\\n    table_path = f\u0027../input/{table_name}\u0027\\n    \\n    # Open as a python file in read-only mode\\n    table_file = open(table_path, \u0027r\u0027)\\n    \\n    # Read the contents of the file into \u0027html\u0027\\n    html = BeautifulSoup(open(table_path, \u0027r\u0027))\\n    \\n    # Find \u0027news-table\u0027 in the Soup and load it into \u0027html_table\u0027\\n    html_table = html.find(id=\u0027news-table\u0027)\\n    \\n    # Add the table to our dictionary\\n    html_tables[table_name] = html_table   \\n\\nprint(\u0027ok!\u0027)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002210\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 2. What is inside those files anyway?\\n\u003cp\u003eWe\u0027ve grabbed the table that contains the headlines from each stock\u0027s HTML file, but before we start parsing those tables further, we need to understand how the data in that table is structured. We have a few options for this:\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eOpen the HTML file with a text editor (preferably one with syntax highlighting, like \u003ca href=\\\u0022http://www.sublimetext.com/\\\u0022\u003eSublime Text\u003c/a\u003e) and explore it there\u003c/li\u003e\\n\u003cli\u003eUse your browser\u0027s \u003ca href=\\\u0022https://addons.mozilla.org/en-US/firefox/addon/web-developer/\\\u0022\u003ewebdev toolkit\u003c/a\u003e to explore the HTML\u003c/li\u003e\\n\u003cli\u003eExplore the headlines table here in this notebook!\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003eLet\u0027s do the third option.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002210\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Read one single day of headlines \\ntsla = html_tables[\u0027tsla_22sep.html\u0027]\\n# Get all the table rows tagged in HTML with \u003ctr\u003e into \u0027tesla_tr\u0027\\ntsla_tr = tsla.findAll(\u0027tr\u0027)\\n\\n# For each row...\\n\\nfor i, table_row in enumerate(tsla_tr):\\n    # Read the text of the element \u0027a\u0027 into \u0027link_text\u0027\\n    link_text = table_row.a.get_text()\\n    # Read the text of the element \u0027td\u0027 into \u0027data_text\u0027\\n    data_text = table_row.td.get_text()\\n    # Print the count\\n    print(f\u0027{i}:\u0027)\\n    # Print the contents of \u0027link_text\u0027 and \u0027data_text\u0027 \\n    print(link_text)\\n    print(data_text)\\n    # The following exits the loop after three rows to prevent spamming the notebook, do not touch\\n    if i == 3:\\n        break\\n    \u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002217\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 3. Extra, extra! Extract the news headlines\\n\u003cp\u003eAs we saw above, the interesting data inside each table row (\u003ccode\u003e\u0026lt;tr\u0026gt;\u003c/code\u003e) is in the text inside the \u003ccode\u003e\u0026lt;td\u0026gt;\u003c/code\u003e and \u003ccode\u003e\u0026lt;a\u0026gt;\u003c/code\u003e tags. Let\u0027s now actually parse the data for \u003cstrong\u003eall\u003c/strong\u003e tables in a comfortable data structure.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002217\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Hold the parsed news into a list\\nparsed_news = []\\n# Iterate through the news\\nfor file_name, news_table in html_tables.items():\\n    # Iterate through all tr tags in \u0027news_table\u0027\\n    for x in news_table.findAll(\u0027tr\u0027):\\n        \\n        # Read the text from the tr tag into text\\n        text = x.get_text()\\n\\n        # Split the text in the td tag into a list \\n        date_scrape = x.td.text.split()\\n        headline = x.a.text\\n\\n        # If the length of \u0027date_scrape\u0027 is 1, load \u0027time\u0027 as the only element\\n        # If not, load \u0027date\u0027 as the 1st element and \u0027time\u0027 as the second\\n        \\n        if len(date_scrape) == 1:\\n            time = date_scrape[0]\\n            \\n        else:\\n            date = date_scrape[0]\\n            time = date_scrape[1]\\n        \\n        # Extract the ticker from the file name, get the string up to the 1st \u0027_\u0027  \\n        ticker = file_name.split(\u0027_\u0027)[0]\\n        \\n        # Append ticker, date, time and headline as a list to the \u0027parsed_news\u0027 list\\n        parsed_news.append([ticker, date, time, headline])\\n\\nprint(parsed_news[:10])\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002224\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 4. Make NLTK think like a financial journalist\\n\u003cp\u003eSentiment analysis is very sensitive to context. As an example, saying \u003cem\u003e\\\u0022This is so addictive!\\\u0022\u003c/em\u003e often means something positive if the context is a video game you are enjoying with your friends, but it very often means something negative when we are talking about opioids. Remember that the reason we chose headlines is so we can try to extract sentiment from financial journalists, who like most professionals, have their own lingo. Let\u0027s now make NLTK think like a financial journalist by adding some new words and sentiment values to our lexicon.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002224\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# NLTK VADER for sentiment analysis\\nfrom nltk.sentiment.vader import SentimentIntensityAnalyzer\\n\\n# New words and values\\nnew_words = {\\n    \u0027crushes\u0027: 10,\\n    \u0027beats\u0027: 5,\\n    \u0027misses\u0027: -5,\\n    \u0027trouble\u0027: -10,\\n    \u0027falls\u0027: -100,\\n}\\n# Instantiate the sentiment intensity analyzer with the existing lexicon\\nvader = SentimentIntensityAnalyzer()\\n# Update the lexicon\\nvader.lexicon.update(new_words)\\n\\nprint(\u0027ok!\u0027)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002231\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 5. BREAKING NEWS: NLTK Crushes Sentiment Estimates\\n\u003cp\u003eNow that we have the data and the algorithm loaded, we will get to the core of the matter: programmatically predicting sentiment out of news headlines! Luckily for us, VADER is very high level so, in this case, we will not adjust the model further\u003csup\u003e*\u003c/sup\u003e other than the lexicon additions from before.\u003c/p\u003e\\n\u003cp\u003e\u003csup\u003e*\u003c/sup\u003eVADER \\\u0022out-of-the-box\\\u0022 with some extra lexicon would likely translate into \u003cstrong\u003eheavy losses\u003c/strong\u003e with real money. A real sentiment analysis tool with chances of being profitable will require a very extensive and dedicated to finance news lexicon. Furthermore, it might also not be enough using a pre-packaged model like VADER.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002231\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Use these column names\\ncolumns = [\u0027ticker\u0027, \u0027date\u0027, \u0027time\u0027, \u0027headline\u0027]\\n# Convert the list of lists into a DataFrame\\nscored_news = pd.DataFrame(parsed_news, columns=columns)\\n\\n# Iterate through the headlines and get the polarity scores\\nscores = scored_news[\u0027headline\u0027].apply(vader.polarity_scores)\\n\\n# Convert the list of dicts into a DataFrame\\nscores_df = pd.DataFrame.from_records(scores)\\n\\n# Join the DataFrames\\nscored_news = scored_news.join(scores_df)\\n\\n# Convert the date column from string to datetime\\nscored_news[\u0027date\u0027] = pd.to_datetime(scored_news.date).dt.date\\nprint(scored_news.head())\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002238\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 6. Plot all the sentiment in subplots\\n\u003cp\u003eNow that we have the scores, let\u0027s start plotting the results. We will start by plotting the time series for the stocks we have.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002238\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022import matplotlib.pyplot as plt\\nimport seaborn as sns\\n\\n%matplotlib inline\\n\\n# Group by date and ticker columns from scored_news and calculate the mean\\nmean_c = scored_news.groupby([\u0027date\u0027, \u0027ticker\u0027]).mean()\\n\\n# Unstack the column ticker\\nmean_c = mean_c.unstack(\u0027ticker\u0027)\\n\\n# Get the cross-section of compound in the \u0027columns\u0027 axis\\nmean_c = mean_c.xs(\u0027compound\u0027, axis=\u0027columns\u0027)\\n# Plot a bar chart with pandas\\n\\nmean_c.plot(kind=\u0027bar\u0027, figsize=(10,5), width=1)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002245\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 7. Weekends and duplicates\\n\u003cp\u003eWhat happened to Tesla on November 22nd? Since we happen to have the headlines inside our \u003ccode\u003eDataFrame\u003c/code\u003e, a quick peek reveals that there are a few problems with that particular day: \u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003eThere are only 5 headlines for that day.\u003c/li\u003e\\n\u003cli\u003eTwo headlines are verbatim the same as another but from another news outlet.\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003eLet\u0027s clean up the dataset a bit, but not too much! While some headlines are the same news piece from different sources, the fact that they are written differently could provide different perspectives on the same story. Plus, when one piece of news is more important, it tends to get more headlines from multiple sources. What we want to get rid of is verbatim copied headlines, as these are very likely coming from the same journalist and are just being \\\u0022forwarded\\\u0022 around, so to speak.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002245\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Count the number of headlines in scored_news (store as integer)\\nnum_news_before = scored_news[\u0027headline\u0027].count()\\n\\n# Drop duplicates based on ticker and headline\\nscored_news_clean = scored_news.drop_duplicates(subset=[\u0027ticker\u0027,\u0027headline\u0027])\\n                      \\n# Count number of headlines after dropping duplicates\\nnum_news_after = scored_news_clean[\u0027headline\u0027].count()\\n                                                        \\n# Print before and after numbers to get an idea of how we did \\nprint(f\\\u0022Before we had {num_news_before} headlines, now we have {num_news_after}\\\u0022)\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002252\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 8. Sentiment on one single trading day and stock\\n\u003cp\u003eJust to understand the possibilities of this dataset and get a better feel of the data, let\u0027s focus on one trading day and one single stock. We will make an informative plot where we will see the smallest grain possible: headline and subscores.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002252\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022# Set the index to ticker and date\\nsingle_day = scored_news_clean.set_index([\u0027ticker\u0027, \u0027date\u0027])\\n# Cross-section the fb row\\nsingle_day = single_day.xs(\u0027fb\u0027)\\n\\n# Select the 3rd of January of 2019\\nsingle_day = single_day[\u00272019-01-3\u0027]\\n\\n# Convert the datetime string to just the time\\nsingle_day[\u0027time\u0027] = pd.to_datetime(single_day[\u0027time\u0027]).dt.time\\n\\n# Set the index to time and \\nsingle_day = single_day.set_index(\u0027time\u0027)\\n\\n# Sort it\\nsingle_day = single_day.sort_index()\\nprint(single_day.info())\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002259\u0022},\u0022deletable\u0022:false,\u0022editable\u0022:false,\u0022run_control\u0022:{\u0022frozen\u0022:true},\u0022tags\u0022:[\u0022context\u0022]},\u0022cell_type\u0022:\u0022markdown\u0022,\u0022source\u0022:\u0022## 9. Visualize the single day\\n\u003cp\u003eWe will make a plot to visualize the positive, negative and neutral scores for a single day of trading and a single stock. This is just one of the many ways to visualize this dataset.\u003c/p\u003e\u0022},{\u0022metadata\u0022:{\u0022dc\u0022:{\u0022key\u0022:\u002259\u0022},\u0022tags\u0022:[\u0022sample_code\u0022],\u0022trusted\u0022:true},\u0022cell_type\u0022:\u0022code\u0022,\u0022source\u0022:\u0022TITLE = \\\u0022Positive, negative and neutral sentiment for FB on 2019-01-03\\\u0022\\nCOLORS = [\\\u0022red\\\u0022, \\\u0022orange\\\u0022, \\\u0022green\\\u0022]\\n\\n# Drop the columns that aren\u0027t useful for the plot\\nplot_day = single_day.drop([\u0027headline\u0027, \u0027compound\u0027], axis=1)\\n\\n# Change the column names to \u0027negative\u0027, \u0027positive\u0027, and \u0027neutral\u0027\\nplot_day.columns = [\u0027negative\u0027, \u0027positive\u0027, \u0027neutral\u0027]\\n\\n# Plot a stacked bar chart\\nplot_day.plot(kind=\u0027bar\u0027, color=COLORS, figsize=(10,5), width=1)\\n\u0022,\u0022execution_count\u0022:null,\u0022outputs\u0022:[]}],\u0022metadata\u0022:{\u0022kernelspec\u0022:{\u0022name\u0022:\u0022python3\u0022,\u0022display_name\u0022:\u0022Python 3\u0022,\u0022language\u0022:\u0022python\u0022},\u0022language_info\u0022:{\u0022name\u0022:\u0022python\u0022,\u0022version\u0022:\u00223.6.7\u0022,\u0022mimetype\u0022:\u0022text/x-python\u0022,\u0022codemirror_mode\u0022:{\u0022name\u0022:\u0022ipython\u0022,\u0022version\u0022:3},\u0022pygments_lexer\u0022:\u0022ipython3\u0022,\u0022nbconvert_exporter\u0022:\u0022python\u0022,\u0022file_extension\u0022:\u0022.py\u0022}},\u0022nbformat\u0022:4,\u0022nbformat_minor\u0022:1}","dateCreated":"2019-11-08T18:54:26.3385617Z"},"resources":null,"isolatorResults":"\u003cresults\u003e\u003cdisk_kb_free\u003e4822024\u003c/disk_kb_free\u003e\u003cdocker_image_digest\u003e3f301a087ffee48dc31f86c5b708c065e20895dad34d5a8cec78e855f4a80108\u003c/docker_image_digest\u003e\u003cdocker_image_id\u003esha256:384ac18c2e506214f12862faa681c589db190669b132ede8f7fbb7a2a6a3bb3f\u003c/docker_image_id\u003e\u003cdocker_image_name\u003egcr.io/kaggle-images/python@sha256:3f301a087ffee48dc31f86c5b708c065e20895dad34d5a8cec78e855f4a80108\u003c/docker_image_name\u003e\u003cexit_code\u003e0\u003c/exit_code\u003e\u003cfailure_message /\u003e\u003cinvalid_path_errors\u003eFalse\u003c/invalid_path_errors\u003e\u003cout_of_memory\u003eFalse\u003c/out_of_memory\u003e\u003crun_time_seconds\u003e11.196112913981779\u003c/run_time_seconds\u003e\u003csucceeded\u003eTrue\u003c/succeeded\u003e\u003ctimeout_exceeded\u003eFalse\u003c/timeout_exceeded\u003e\u003cused_all_space\u003eFalse\u003c/used_all_space\u003e\u003cwas_killed\u003eFalse\u003c/was_killed\u003e
