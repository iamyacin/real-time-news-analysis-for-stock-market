server.port=${SERVER_PORT:8081}

# MongoDB is the only database used by this app. MySQL/JPA was unused in the
# original code and was removed during the 2026 restoration.
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/StockNewsDB}
spring.data.mongodb.database=${MONGO_DB:StockNewsDB}

# Demo authentication
stockmarket.app.jwtSecret=${JWT_SECRET:change-me-in-env}
stockmarket.app.jwtExpirationMs=86400000
stockmarket.app.demoPassword=${DEMO_ADMIN_PASSWORD:admin123}

logging.level.web=INFO
logging.level.org.springframework.data.mongodb=INFO
